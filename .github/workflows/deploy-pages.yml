# Corre las pruebas y, si pasan, publica el sitio (estático, sin build)
# en GitHub Pages cada vez que se sube algo a la rama "main".

name: Test and deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pruebas del motor
        run: node test/services.test.js

      - name: Instalar Playwright + Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Pruebas de navegador
        run: node test/e2e.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    concurrency:
      group: "pages"
      cancel-in-progress: false

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar los archivos del sitio
        run: |
          mkdir _site
          cp index.html admin.html style.css admin.css config.js services.js script.js admin.js \
             supabase-config.js supabaseClient.js _site/
          cp -r assets _site/assets

      - name: Subir el sitio como artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
