<!DOCTYPE html>
<!--
  admin.html = panel privado del vendedor.
  Usa el mismo "esqueleto" visual que index.html (app-shell, ambient-glow,
  header con logo) para que se sienta parte de la misma app, no una
  pantalla aparte pegada con alfileres.
-->
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de administración</title>
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="ambient-glow" aria-hidden="true"></div>

  <main class="app-shell">

    <!-- ===================== LOGIN ===================== -->
    <section class="screen intro-screen" id="loginView">
      <div class="intro-glow" aria-hidden="true"></div>
      <img src="assets/logo.png" alt="" class="intro-logo" aria-hidden="true">
      <h1 class="intro-title" style="font-size:26px;">Panel de administración</h1>
      <p class="intro-subtitle">Ingresá tus credenciales de vendedor para gestionar precios, catálogo y contacto.</p>

      <form id="loginForm" class="admin-login-form" autocomplete="on">
        <input id="loginUser" class="select-input" placeholder="Usuario" autocomplete="username" required>
        <input id="loginPass" type="password" class="select-input" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="submit" class="btn btn-primary btn-full">Ingresar</button>
        <p class="admin-login-error" id="loginError" hidden>Usuario o contraseña incorrectos.</p>
      </form>
    </section>

    <!-- ===================== PANEL ===================== -->
    <section class="screen admin-screen" id="panelView" hidden>

      <header class="app-header admin-header">
        <div class="brand">
          <img src="assets/logo.png" alt="" class="brand-logo">
          <div class="brand-text">
            <span class="brand-name" id="adminBrandName">Apple Tech</span>
            <span class="brand-tag">Panel de administración</span>
          </div>
        </div>
        <button class="admin-logout-btn" id="btnLogout" title="Cerrar sesión">Salir</button>
      </header>

      <nav class="admin-tabs" id="adminTabs">
        <button class="admin-tab is-active" data-tab="dashboard">Resumen</button>
        <button class="admin-tab" data-tab="catalog">Catálogo</button>
        <button class="admin-tab" data-tab="damages">Desperfectos</button>
        <button class="admin-tab" data-tab="battery">Batería</button>
        <button class="admin-tab" data-tab="contact">Contacto</button>
        <button class="admin-tab" data-tab="backups">Backups</button>
        <button class="admin-tab" data-tab="security">Seguridad</button>
      </nav>

      <div class="step-scroll admin-content" id="tabContent"><!-- JS renderiza acá --></div>

    </section>

  </main>

  <script src="config.js"></script>
  <script src="services.js"></script>
  <script src="admin.js"></script>
</body>
</html>
