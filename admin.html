<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apple Tech Admin</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient-glow"></div><main class="app-shell"><header class="app-header"><div class="brand"><img src="assets/logo.png" class="brand-logo"><div class="brand-text"><span class="brand-name">Apple Tech</span><span class="brand-tag">Panel Admin</span></div></div></header><section id="loginView" class="screen intro-screen"><h2>Administración</h2><input id="u" class="select-input" placeholder="Usuario"><br><br><input id="p" class="select-input" type="password" placeholder="Contraseña"><br><br><button class="btn btn-primary btn-full" onclick="login()">Ingresar</button><p>Demo: admin / admin123</p></section><section id="panelView" hidden><div style="display:flex;gap:10px;flex-wrap:wrap;margin:15px 0"><button class="btn btn-secondary" onclick="showTab('dashboard')">Dashboard</button><button class="btn btn-secondary" onclick="showTab('catalog')">Catálogo</button><button class="btn btn-secondary" onclick="showTab('contact')">Contacto</button><button class="btn btn-secondary" onclick="exportData()">Exportar</button></div><div id="tab"></div></section></main><script src="admin.js"></script></body></html>
