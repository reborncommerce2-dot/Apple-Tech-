<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='style.css'><title>Admin</title></head><body><main class='app-shell'><header class='app-header'><div class='brand'><img src='assets/logo.png' class='brand-logo'><div class='brand-text'><span class='brand-name'>Apple Tech Admin</span></div></div></header><section id='loginView' class='screen'><h2>Login</h2><input id='u' class='select-input' placeholder='Usuario'><input id='p' type='password' class='select-input' placeholder='Contraseña'><button class='btn btn-primary' onclick='login()'>Ingresar</button></section><section id='panelView' hidden><div style='display:flex;gap:8px;flex-wrap:wrap'><button onclick="showTab('dashboard')">Dashboard</button><button onclick="showTab('catalog')">Catálogo</button><button onclick="showTab('contact')">Contacto</button><button onclick='exportData()'>Backup</button><button onclick='logout()'>Salir</button></div><div id='tab'></div></section></main><script src='admin.js'></script></body></html>
